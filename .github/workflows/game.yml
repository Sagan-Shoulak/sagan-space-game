name: Space Game seed

on:
  push:
    branches: [dev, main]
    paths: [".github/workflows/game.yml", "scripts/**", "src/**", "tests/**", "sagan.toml", "sagan.lock", "sagan-source-commit.txt", "sagan-physics-commit.txt", "sagan-render-commit.txt"]
  pull_request:
    branches: [dev, main]
    paths: [".github/workflows/game.yml", "scripts/**", "src/**", "tests/**", "sagan.toml", "sagan.lock", "sagan-source-commit.txt", "sagan-physics-commit.txt", "sagan-render-commit.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux }
          - { runner: windows-latest, os: windows }
    steps:
      - uses: actions/checkout@v7
        with:
          path: game
          persist-credentials: false
      - name: Resolve exact source pins
        id: pins
        shell: bash
        working-directory: game
        run: |
          sagan="$(tr -d '\r\n' < sagan-source-commit.txt)"
          physics="$(tr -d '\r\n' < sagan-physics-commit.txt)"
          render="$(tr -d '\r\n' < sagan-render-commit.txt)"
          [[ "$sagan" =~ ^[0-9a-f]{40}$ && "$physics" =~ ^[0-9a-f]{40}$ && "$render" =~ ^[0-9a-f]{40}$ ]]
          echo "sagan=$sagan" >> "$GITHUB_OUTPUT"
          echo "physics=$physics" >> "$GITHUB_OUTPUT"
          echo "render=$render" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Sagan-Shoulak/sagan
          ref: ${{ steps.pins.outputs.sagan }}
          path: sagan-source
          fetch-depth: 0 # Version calculation requires the baseline commit history.
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Sagan-Shoulak/sagan-physics
          ref: ${{ steps.pins.outputs.physics }}
          path: physics
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Sagan-Shoulak/sagan-render
          ref: ${{ steps.pins.outputs.render }}
          path: render
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-gcc
      - name: Build pinned compiler (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: sagan-source
        run: make -j2 bin/sagan
      - name: Build pinned compiler (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: sagan-source
        run: make -j2 bin/sagan
      - name: Run game seed (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: game
        run: |
          export SAGAN_EXECUTABLE="$GITHUB_WORKSPACE/sagan-source/bin/sagan"
          export SAGAN_PHYSICS_SOURCE_ROOT="$GITHUB_WORKSPACE/physics"
          export SAGAN_RENDER_SOURCE_ROOT="$GITHUB_WORKSPACE/render"
          export SAGAN_PACKAGE_INDEX="$(bash scripts/resolve-packages.sh)"
          mkdir -p build/ci
          bash -n scripts/resolve-sagan.sh scripts/resolve-physics.sh scripts/resolve-render.sh scripts/resolve-packages.sh scripts/run.sh
          "$SAGAN_EXECUTABLE" --emit-cpp-package . build/ci/program.cpp
          bash tests/integration/game_seed_test.sh
      - name: Run game seed (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: game
        run: |
          root="$(cygpath -u "$GITHUB_WORKSPACE")"
          export SAGAN_EXECUTABLE="$root/sagan-source/bin/sagan.exe"
          export SAGAN_PHYSICS_SOURCE_ROOT="$root/physics"
          export SAGAN_RENDER_SOURCE_ROOT="$root/render"
          export SAGAN_PACKAGE_INDEX="$(bash scripts/resolve-packages.sh)"
          mkdir -p build/ci
          bash -n scripts/resolve-sagan.sh scripts/resolve-physics.sh scripts/resolve-render.sh scripts/resolve-packages.sh scripts/run.sh
          "$SAGAN_EXECUTABLE" --emit-cpp-package . build/ci/program.cpp
          bash tests/integration/game_seed_test.sh
